<!DOCTYPE html><html><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1.0"><title>Business Connect Uganda</title><style>*{margin:0;padding:0;box-sizing:border-box;font-family:system-ui}body{background:#f5f7fb;padding:12px}.header{background:#0a7a43;color:#fff;padding:18px;border-radius:16px;text-align:center}.card{background:#fff;border-radius:14px;padding:14px;margin:10px 0}.card a{background:#25D366;color:#fff;padding:8px 14px;border-radius:8px;text-decoration:none;display:inline-block;margin-top:6px}.formBox{background:#fff;border-radius:14px;padding:16px;margin-top:16px}input,select{width:100%;padding:12px;border-radius:10px;border:1px solid #ddd;margin-bottom:10px}button{width:100%;background:#0a7a43;color:#fff;padding:14px;border:none;border-radius:10px;font-weight:700}</style></head><body><div class="header"><h1>Business Connect Uganda</h1><p>By Daniel Mityana - AAB - Future Doctor & CEO</p></div><div id="list"></div><div class="formBox"><h3>Add Business FREE</h3><input id="n" placeholder="Business Name"><select id="c"><option value="">Category</option><option>Dental</option><option>Hardware</option><option>Shop</option><option>School</option><option>Study Resources</option></select><select id="l"><option value="">District</option><option>Mityana</option><option>Kampala</option><option>Wakiso</option></select><input id="p" placeholder="256777353793"><button onclick="add()">Add Business</button></div><script>let b=JSON.parse(localStorage.getItem('bcu')||'[]');if(b.length==0){b=[{name:"Dani Study Resources",cat:"Study Resources",loc:"Mityana",phone:"256777353793"},{name:"Smile Dental Care Mityana",cat:"Dental",loc:"Mityana",phone:"256777353793"},{name:"Mityana Hardware",cat:"Hardware",loc:"Mityana",phone:"256772000001"}];localStorage.setItem('bcu',JSON.stringify(b))}function render(){document.getElementById('list').innerHTML=b.map(x=>`<div class=card><h3>${x.name}</h3><div>📍 ${x.loc} • ${x.cat}</div><a href=https://wa.me/${x.phone}>WhatsApp ${x.phone}</a></div>`).join('')}function add(){let name=document.getElementById('n').value,cat=document.getElementById('c').value,loc=document.getElementById('l').value,ph=document.getElementById('p').value;if(!name||!cat||!loc||!ph){alert('Fill all');return}b.unshift({name,cat,loc,phone:ph});localStorage.setItem('bcu',JSON.stringify(b));render();alert('Added')}render()</script></body></html>
