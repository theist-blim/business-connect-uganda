<!DOCTYPE html>
<html><head><meta name="viewport" content="width=device-width,initial-scale=1">
<title>List Business - BCU</title>
<style>body{font-family:sans-serif;padding:20px;max-width:500px;margin:auto}input,select,textarea{width:100%;padding:12px;margin:8px 0;border:1px solid #ccc;border-radius:8px}button{background:#25D366;color:white;padding:14px;border:none;border-radius:8px;width:100%;font-weight:bold;font-size:16px}</style>
</head><body>
<h2>List Your Business FREE on BCU</h2>
<p>Get customers from Mityana + Google</p>
<input id="biz" placeholder="Business Name e.g. Alex Phone Repair">
<select id="cat"><option>Select Category</option><option>Phone Repair</option><option>Restaurant</option><option>Salon</option><option>Shop</option><option>Boda Boda</option><option>Other</option></select>
<input id="loc" placeholder="Location e.g. Mityana Town">
<input id="wap" placeholder="Your WhatsApp e.g. 0777xxxxxx">
<textarea id="desc" placeholder="What do you sell?"></textarea>
<button onclick="send()">Submit → WhatsApp CEO Daniel</button>
<script>
function send(){
let b=document.getElementById('biz').value;
let c=document.getElementById('cat').value;
let l=document.getElementById('loc').value;
let w=document.getElementById('wap').value;
let d=document.getElementById('desc').value;
if(!b||!w){alert('Fill Business Name and WhatsApp!');return;}
let msg=`NEW BCU LISTING by%0A%0ABusiness: ${b}%0ACategory: ${c}%0ALocation: ${l}%0AOwner WhatsApp: ${w}%0ADesc: ${d}%0A%0AI want to be listed on BCU!`;
window.open(`https://wa.me/256777353793?text=${msg}`,'_blank');
}
</script>
<br><a href="index.html">← Back to Businesses</a>
</body></html>
